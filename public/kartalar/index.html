<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0a14">
  <title>Kartalar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=104">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wind" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3" result="n"><animate attributeName="baseFrequency" dur="6s" values="0.012 0.03;0.016 0.036;0.012 0.03" repeatCount="indefinite"/></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6"><animate attributeName="scale" dur="3.2s" values="3;8;3" repeatCount="indefinite"/></feDisplacementMap>
  </filter><filter id="flow" x="-8%" y="-4%" width="116%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.022" numOctaves="2" seed="7" result="t"/>
    <feOffset in="t" dx="0" dy="0" result="n"><animate attributeName="dy" dur="5.5s" values="0;46;0" repeatCount="indefinite"/><animate attributeName="dx" dur="7s" values="0;-18;0" repeatCount="indefinite"/></feOffset>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="9"><animate attributeName="scale" dur="4.2s" values="6;14;8;12;6" repeatCount="indefinite"/></feDisplacementMap>
  </filter></svg>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">札</span>
      <div>
        <h1 data-t="title">Kartalar</h1>
        <p class="sub"><b id="held">0</b>/<span id="total">0</span> · <span data-t="collected">to'plandi</span></p>
        <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      </div>
    </div>
    <div class="wallet">
      <div class="coins">
        <button type="button" class="coin" id="coinTokens"><span aria-hidden="true">🎟</span><b id="tokenCount">0</b></button>
        <button type="button" class="coin" id="coinShards"><span aria-hidden="true">💎</span><b id="shardTop">0</b><i class="plus" aria-hidden="true">+</i><i class="event-badge" id="eventBadge" hidden></i></button>
      </div>
      <div class="wallet-row">
        <button type="button" class="bag" id="bagButton" aria-label="🎒">🎒<i class="bag-badge" id="bagBadge" hidden></i></button>
        <div class="points"><span aria-hidden="true">💠</span><b id="points">0</b></div>
      </div>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <button type="button" class="event-banner" id="eventBanner" hidden>
      <span class="eb-art"><img id="eventBannerArt" alt=""></span>
      <span class="eb-info"><span class="event-tag" id="eventBannerTag"></span><b id="eventBannerTitle"></b><small id="eventBannerLeft"></small></span>
      <span class="eb-go" id="eventBannerGo"></span>
    </button>
    <button type="button" class="quest-entry" id="questEntry" hidden>
      <span class="qe-icon" aria-hidden="true">🎯</span>
      <span class="qe-info"><b id="questEntryTitle"></b><small id="questEntryLine"></small></span>
      <span class="qe-count" id="questEntryCount"></span>
      <i class="dot" id="questDot" hidden></i>
    </button>
    <div class="loading" id="loading" aria-busy="true">
      <p data-t="loading"></p>
      <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <section class="tab" id="tab-collection" hidden>
      <div class="welcome" id="welcome" hidden>
        <span class="welcome-mark" aria-hidden="true">🎴</span>
        <b data-t="welcomeTitle"></b>
        <p data-t="welcomeText"></p>
        <button type="button" class="draw" id="welcomeDraw" data-t="welcomeButton"></button>
      </div>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" data-ph="search">
      </label>
      <div class="sets" id="sets" role="group"></div>
      <div id="shelves"></div>
    </section>

    <section class="tab" id="tab-draw" hidden>
      <div class="stage">
        <div class="deck" id="deck">
          <div class="flip" id="flip">
            <div class="face back"><span class="back-mark">札</span></div>
            <div class="face front" id="front"></div>
          </div>
        </div>
        <p class="result" id="result" aria-live="polite"></p>
        <div id="drawnStats"></div>
        <div class="opens">
          <button type="button" class="draw open-btn" id="open1"><b data-t="open1"></b><small id="open1Cost"></small></button>
          <button type="button" class="draw open-btn" id="open10"><b data-t="open10"></b><small id="open10Cost"></small></button>
        </div>
        <p class="timer" id="nextToken"></p>
        <p class="timer pity" id="pityLine"></p>
        <button type="button" class="link" id="seeCollection" data-t="seeCollection" hidden></button>
        <ul class="odds" id="odds"></ul>
      </div>
    </section>

    <section class="tab" id="tab-market" hidden>
      <div class="market-head">
        <p class="market-hint" id="marketHint"></p>
        <button type="button" class="draw" id="newOffer" data-t="newOffer"></button>
        <div class="sets" id="marketFilter" role="group">
          <button type="button" data-f="all" data-t="filterAll"></button>
          <button type="button" data-f="can" data-t="filterCan"></button>
          <button type="button" data-f="mine" data-t="filterMine"></button>
        </div>
      </div>
      <ul class="offers" id="offers"></ul>
    </section>

    <section class="tab" id="tab-anime" hidden>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="animeSearch" type="search" autocomplete="off" data-ph="animeSearch">
      </label>
      <div id="animeList" class="anime-list"></div>
      <div id="animeCards" hidden>
        <button type="button" class="link anime-back" id="animeBack" data-t="animeBack"></button>
        <div class="anime-head"><h2 id="animeTitle"></h2><span id="animeHeld"></span></div>
        <div class="anime-reward" id="animeReward" hidden></div>
        <div class="grid" id="animeGrid"></div>
      </div>
    </section>

    <section class="tab" id="tab-shop" hidden>
      <div class="shop">
        <div class="events" id="events"></div>
        <template id="eventTemplate">
          <div class="event">
            <div class="event-art"></div>
            <div class="event-info">
              <span class="event-tag"></span>
              <h2 class="event-title"></h2>
              <p class="event-ends"></p>
              <p class="event-odds"></p>
              <div class="event-pity"><span class="event-pity-text"></span><div class="progress"><i class="event-pity-bar"></i></div></div>
            </div>
            <div class="event-buttons">
              <button type="button" class="draw event-one"></button>
              <button type="button" class="draw event-batch"></button>
            </div>
          </div>
        </template>
        <div class="shop-block">
          <h2 class="shop-title" data-t="shopBuyTitle"></h2>
          <p class="market-hint" data-t="shopBuyHint"></p>
          <div class="packs" id="crystalPacks"></div>
        </div>
        <div class="shop-block">
          <h2 class="shop-title" data-t="shopItemsTitle"></h2>
          <p class="market-hint" id="shopWallet"></p>
          <ul class="shop-items" id="shopItems"></ul>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-arena" hidden>
      <div class="sets arena-mode" id="arenaMode" role="group">
        <button type="button" data-m="arena" data-t="arenaTab"></button>
        <button type="button" data-m="tower" data-t="towerTab"></button>
      </div>
      <div class="arena" id="arenaMain">
        <div class="arena-me" id="arenaMe"></div>
        <details class="arena-guide" id="arenaGuide"><summary><span id="arenaGuideTitle"></span><i aria-hidden="true">▾</i></summary><div class="guide-body" id="arenaGuideBody"></div></details>
        <div class="arena-block" id="arenaTeamBlock">
          <div class="arena-head"><h2 class="shop-title" data-t="arenaTeam"></h2><b class="arena-power" id="arenaPower"></b></div>
          <p class="market-hint" id="arenaTeamHint"></p>
          <div class="arena-row" id="arenaFront"></div>
          <div class="arena-row rear" id="arenaBack"></div>
          <p class="market-hint arena-rules" id="arenaRules"></p>
          <button type="button" class="draw" id="arenaSave" data-t="arenaSave" disabled></button>
        </div>
        <div class="arena-block" id="arenaFoesBlock">
          <div class="arena-head"><h2 class="shop-title" data-t="arenaFoes"></h2><button type="button" class="ghost" id="arenaRefresh" data-t="arenaRefresh"></button></div>
          <ul class="arena-foes" id="arenaFoes"></ul>
        </div>
        <div class="arena-block" id="arenaShopBlock" hidden>
          <div class="arena-head"><h2 class="shop-title" data-t="arenaShop"></h2><b class="arena-coins" id="arenaShopCoins"></b></div>
          <p class="market-hint" id="arenaShopHint"></p>
          <ul class="shop-items" id="arenaShopItems"></ul>
        </div>
        <div class="arena-block">
          <div class="arena-head"><h2 class="shop-title" data-t="arenaHistory"></h2></div>
          <ul class="arena-foes" id="arenaHistory"></ul>
        </div>
      </div>
      <div class="arena" id="towerMain" hidden>
        <div class="arena-me" id="towerMe"></div>
        <p class="market-hint tower-theme" id="towerTheme"></p>
        <div class="arena-block">
          <div class="arena-head"><h2 class="shop-title" id="towerFloorTitle"></h2><b class="arena-power" id="towerEnemyPower"></b></div>
          <p class="market-hint" id="towerReward"></p>
          <div class="arena-row" id="towerFront"></div>
          <div class="arena-row rear" id="towerBack"></div>
          <p class="market-hint" id="towerHint" hidden></p>
          <button type="button" class="draw" id="towerFight"></button>
          <p class="market-hint" id="towerRule"></p>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-top" hidden>
      <div class="sets" id="topKind" role="group">
        <button type="button" data-k="cards" data-t="topCards"></button>
        <button type="button" data-k="arena" data-t="topArena"></button>
      </div>
      <div class="arena-week" id="arenaWeek" hidden></div>
      <ol class="table" id="table"></ol>
    </section>
  </main>

  <nav class="nav">
    <button type="button" class="on" data-tab="collection"><span aria-hidden="true">🎴</span><b data-t="collection"></b></button>
    <button type="button" data-tab="draw"><span aria-hidden="true">✨</span><b data-t="draw"></b><i class="dot" id="readyDot" hidden></i></button>
    <button type="button" data-tab="market"><span aria-hidden="true">🔄</span><b data-t="market"></b></button>
    <button type="button" data-tab="anime"><span aria-hidden="true">📚</span><b data-t="animeTab"></b></button>
    <button type="button" data-tab="arena"><span aria-hidden="true">⚔️</span><b data-t="arenaTab"></b></button>
    <button type="button" data-tab="top"><span aria-hidden="true">🏆</span><b data-t="top"></b></button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <button type="button" class="close" id="sheetClose" aria-label="✕">✕</button>
    <div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js?v=104"></script>
</body>
</html>
