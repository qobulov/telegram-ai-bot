<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0a2a">
  <title>Uchar gilam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/games.js" defer></script>
  <link rel="stylesheet" href="gilam.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <main id="app">
    <section id="intro" class="screen">
      <h1 class="logo"><span>UCHAR</span><b>GILAM</b></h1>
      <p class="lead" data-t="lead"></p>
      <ul class="rules">
        <li><span class="ico tap" aria-hidden="true"></span><span data-t="rule1"></span></li>
        <li><span class="ico gate" aria-hidden="true"></span><span data-t="rule2"></span></li>
        <li><span class="ico coin" aria-hidden="true"></span><span data-t="rule3"></span></li>
        <li><span class="ico feather" aria-hidden="true"></span><span data-t="rule4"></span></li>
      </ul>
      <button type="button" class="primary" id="play" data-t="play"></button>
      <p class="message" id="introMessage" aria-live="polite"></p>
      <section class="table-card" id="introTable" hidden>
        <h2 data-t="table"></h2>
        <ol class="table" id="introRows"></ol>
      </section>
    </section>

    <section id="game" class="screen" hidden>
      <header class="hud">
        <div class="hud-side">
          <span class="pill"><span data-t="level"></span> <b id="level">1</b></span>
          <span class="pill"><i class="coin-dot" aria-hidden="true"></i> <b id="coins">0</b></span>
          <span class="pill shield" id="shield" hidden data-t="shieldChip"></span>
        </div>
        <span class="score" id="score">0</span>
        <div class="hud-side right">
          <button type="button" class="icon-button" id="pauseButton" aria-label="Pauza">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
          </button>
        </div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <div class="count" id="count" hidden></div>
      <div class="overlay" id="pause" hidden>
        <p class="overlay-title" data-t="paused"></p>
        <button type="button" class="primary" id="resume" data-t="resume"></button>
      </div>
      <p class="hint" data-t="hint"></p>
    </section>

    <section id="result" class="screen" hidden>
      <p class="eyebrow" data-t="over"></p>
      <p class="final" id="final">0</p>
      <p class="summary" id="summary"></p>
      <p class="message" id="resultMessage" aria-live="polite"></p>
      <section class="table-card" id="resultTable" hidden>
        <h2 data-t="table"></h2>
        <ol class="table" id="resultRows"></ol>
      </section>
      <div class="actions">
        <button type="button" class="primary" id="again" data-t="again"></button>
        <button type="button" id="share" data-t="share"></button>
      </div>
    </section>
  </main>
  <script src="sim.js"></script>
  <script src="gilam.js"></script>
</body>
</html>
