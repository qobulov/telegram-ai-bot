<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120b22">
  <title>Maydon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/games.js" defer></script>
  <link rel="stylesheet" href="maydon.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main id="app">
    <section class="screen" id="lobby">
      <h1>⚔️ Maydon</h1>
      <p class="sub" id="lobbySub"></p>
      <h2>Sinfingiz</h2>
      <div class="classes" id="classes"></div>
      <h2 id="rosterTitle">Jangchilar</h2>
      <div class="roster" id="roster"></div>
      <p class="message" id="lobbyMessage" aria-live="polite"></p>
      <div class="actions" id="lobbyActions"></div>
    </section>
    <section class="screen battle" id="battle" hidden>
      <div class="hud">
        <div class="bars"><div class="tbar top"><i id="topBar"></i></div><div class="clock" id="clock">1:30</div><div class="tbar bottom"><i id="bottomBar"></i></div></div>
        <div class="tnames"><span id="topName"></span><span id="bottomName"></span></div>
        <div class="badges"><span class="badge" id="mode"></span></div>
      </div>
      <div class="feed" id="feed"></div>
      <div class="pad" id="pad">
        <button type="button" id="block"><span class="cool" id="blockCool"></span><span class="i">🛡</span>Himoya<small id="blockInfo">tayyor</small></button>
        <button type="button" id="attack"><span class="core"><span class="i">⚔️</span><span id="attackText">URISH</span></span></button>
        <button type="button" id="skill"><span class="cool" id="skillCool"></span><span class="i" id="skillIcon">✨</span><span id="skillName">Mahorat</span><small id="skillInfo">0%</small></button>
      </div>
      <p class="message battle-message" id="battleMessage" aria-live="polite"></p>
    </section>
  </main>
  <div class="overlay" id="overlay" hidden></div>
  <script src="maydon.js"></script>
</body>
</html>
