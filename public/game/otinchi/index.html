<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#8fd3ff">
  <title>O'tinchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/games.js" defer></script>
  <link rel="stylesheet" href="otinchi.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <main id="app">
    <section id="intro" class="screen">
      <h1 class="logo">O'TINCHI</h1>
      <p class="lead" data-t="lead"></p>
      <ul class="rules">
        <li><span class="ico">👈👉</span><span data-t="rule1"></span></li>
        <li><span class="ico">🌿</span><span data-t="rule2"></span></li>
        <li><span class="ico">⏳</span><span data-t="rule3"></span></li>
        <li><span class="ico">✨</span><span data-t="rule4"></span></li>
      </ul>
      <button type="button" class="primary" id="play" data-t="play"></button>
      <p class="message" id="introMessage" aria-live="polite"></p>
      <section class="table-card" id="introTable" hidden>
        <h2 data-t="table"></h2>
        <ol class="table" id="introRows"></ol>
      </section>
    </section>

    <section id="game" class="screen" hidden>
      <div class="hud">
        <p class="score" id="score">0</p>
        <div class="timebar" id="timebar" aria-hidden="true"><i id="time"></i><span id="secs"></span></div>
        <p class="season" id="season"></p>
      </div>
      <p class="tap-hint" id="tapHint" data-t="tapHint"></p>
      <div class="banner" id="banner" hidden></div>
    </section>

    <section id="result" class="screen" hidden>
      <p class="eyebrow" id="why"></p>
      <p class="final" id="final">0</p>
      <p class="message" id="resultMessage" aria-live="polite"></p>
      <section class="table-card" id="resultTable" hidden>
        <h2 data-t="table"></h2>
        <ol class="table" id="resultRows"></ol>
      </section>
      <div class="actions">
        <button type="button" class="primary" id="again" data-t="again"></button>
        <button type="button" id="share" data-t="share"></button>
      </div>
    </section>
  </main>
  <script src="sim.js"></script>
  <script src="otinchi.js"></script>
</body>
</html>
